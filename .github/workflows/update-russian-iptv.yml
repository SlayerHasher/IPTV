name: Update Russian IPTV Playlist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run parser script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python parser.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add play.list playlist.m3u stable_streams.json stable.m3u dashboard.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update sources, playlist and stream lifetime stats" && git push)

      - name: Update README channel counter badge
        if: always()
        run: |
          N=$(grep -c '^#EXTINF' playlist.m3u || echo 0)
          sed -i -E "s#(badge/каналов-)[0-9]+#\1${N}#" README.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update channel counter badge (${N})" && git push)
