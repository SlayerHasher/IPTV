name: Update Russian IPTV Playlist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Cache EPG
        uses: actions/cache@v4
        with:
          path: .cache
          key: epg-${{ github.run_id }}
          restore-keys: epg-

      - name: Run parser script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AUTO_SOURCES: "15"
        run: python iptv_parser.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add play.list playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update sources and playlist" && git push)
